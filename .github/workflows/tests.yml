name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile with strict warnings
        run: gcc -std=c11 -Wall -Wextra -Werror -pedantic -DPRIME_CHECK_NO_MAIN Prime_Check.c test_prime_check.c -o test_prime_check
      - name: Run C tests
        run: ./test_prime_check

